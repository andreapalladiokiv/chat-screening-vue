name: Deploy Vue app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # VITE_ENV_* are inlined at build time (loadEnvironments reads them via
      # import.meta.env). Set each value as a repo secret.
      - run: npm run build
        env:
          BASE_URL: /chat-screening-vue/
          VITE_ENV_NAMES: ${{ secrets.VITE_ENV_NAMES }}
          VITE_ENV_PROJECT_IDS: ${{ secrets.VITE_ENV_PROJECT_IDS }}
          VITE_ENV_ANON_KEYS: ${{ secrets.VITE_ENV_ANON_KEYS }}
          VITE_ENV_ALLOWED_DOMAINS: ${{ secrets.VITE_ENV_ALLOWED_DOMAINS }}

      # vue-router uses history mode — clone index.html as 404.html so deep
      # links (/login, /?session=…) survive a hard reload on GitHub Pages.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
