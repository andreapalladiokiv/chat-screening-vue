# Local development — two services side by side:
#
#   chat-view-legacy  → http://localhost:8080  (vanilla app.js from legacy/)
#   chat-view-vue     → http://localhost:5173  (Vue 3 rewrite, Vite dev server)
#
# Usage:
#   docker compose up -d                     # both
#   docker compose up -d chat-view-legacy    # legacy only
#   docker compose logs -f chat-view-vue
#   docker compose down
#
# The Vue service uses a named volume for /app/node_modules so npm install
# only runs once. Force a fresh install with: docker compose down -v.

services:
  chat-view-legacy:
    image: nginx:alpine
    container_name: chat-view-legacy
    ports:
      - "8080:80"
    volumes:
      - ./legacy:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

  chat-view-vue:
    image: node:22-alpine
    container_name: chat-view-vue
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - vue-node-modules:/app/node_modules
    command: sh -c "npm install --no-fund --no-audit && npm run dev"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true  # ensure HMR works through bind-mount on some hosts

volumes:
  vue-node-modules:
