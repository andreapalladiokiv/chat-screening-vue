server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Local dev: never cache — edits to index.html / app.js / config.js
    # must show on a plain browser reload, no ?v=N games.
    add_header Cache-Control "no-store" always;
    expires    off;
    etag       off;

    # Hide repo internals from the served root (we mount the whole repo
    # for convenience, but dotfiles, docs and backend sources don't belong
    # on HTTP — even on localhost).
    location ~ /\.             { deny all; access_log off; log_not_found off; }
    location ~ ^/(supabase|docs|docker)/ { deny all; }
    location ~ \.(md|yml|yaml)$ { deny all; }
}
